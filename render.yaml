databases:
  - name: cybertrace-db
    databaseName: cybertrace
    user: cybertrace
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: cybertrace-api
    runtime: python
    rootDir: src/CyberTrace/backend
    region: oregon
    plan: starter
    buildCommand: pip install .
    preDeployCommand: python -c "import asyncio; import app.models; from app.db import init_models; asyncio.run(init_models())"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: cybertrace-evidence
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybertrace-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: EVIDENCE_STORAGE_DIR
        value: /var/data/evidence
      - key: REPORTS_STORAGE_DIR
        value: /var/data/reports
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://cybertrace-web.onrender.com"]'

  - type: web
    name: cybertrace-web
    runtime: static
    rootDir: src/CyberTrace/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cybertrace-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
